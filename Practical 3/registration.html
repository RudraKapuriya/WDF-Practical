<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registration | Vidya Setu Student Hub</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><div class="auth-wrap" style="max-width:650px"><div class="auth-brand"><a class="logo" href="index.html" style="justify-content:center"><span class="logo-mark">VS</span><span><strong>Vidya Setu</strong><small>Student Hub</small></span></a><h1>Student Registration</h1></div>
<form class="form-card"><h2>Create student account</h2><div class="form-row"><div><label>First Name</label><input type="text" placeholder="First name"></div><div><label>Last Name</label><input type="text" placeholder="Last name"></div></div><div class="form-row"><div><label>Student ID</label><input type="text" placeholder="Student ID"></div><div><label>Course</label><select><option>Select course</option><option>BCA</option><option>BBA</option><option>B.Sc IT</option></select></div></div><label>Email Address</label><input type="email" placeholder="Email address"><div class="form-row"><div><label>Password</label><input type="password" placeholder="Create password"></div><div><label>Confirm Password</label><input type="password" placeholder="Confirm password"></div></div><button class="btn btn-primary" style="width:100%" type="button">Register</button><p class="form-note">Already registered? <a href="login.html">Go to login</a></p></form></div></body></html>
