<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us | Vidya Setu Student Hub</title>
</head>
<body bgcolor="#F4F8F3" text="#2D3E2E">

  <table width="100%" bgcolor="#2E5A36" cellpadding="15">
    <tr>
      <td align="center">
        <font color="#FFFFFF" face="Arial">
          <h1>Contact & Support</h1>
        </font>
      </td>
    </tr>
    <tr>
      <td align="center" bgcolor="#3B6E45">
        <font face="Arial" size="2">
          <a href="index.html" style="color:white;"><b>Home</b></a> &nbsp;|&nbsp;
          <a href="contact.html" style="color:white;"><b>Contact</b></a> &nbsp;|&nbsp;
          <a href="login.html" style="color:white;"><b>Login</b></a>
        </font>
      </td>
    </tr>
  </table>

  <br>

  <table width="500" align="center" border="1" cellpadding="15" bgcolor="#FFFFFF" bordercolor="#C3DBC5">
    <tr>
      <td>
        <form>
          <h2 align="center">Send Support Request</h2>
          
          <label for="name"><b>Full Name:</b></label><br>
          <input type="text" id="name" name="name" style="width:100%; padding:8px; margin-top:5px;" required><br><br>

          <label for="email"><b>Email Address:</b></label><br>
          <input type="email" id="email" name="email" style="width:100%; padding:8px; margin-top:5px;" required><br><br>

          <label for="department"><b>Department:</b></label><br>
          <select id="department" name="department" style="width:100%; padding:8px; margin-top:5px;">
            <option value="academic">Academic Section</option>
            <option value="exam">Examination Cell</option>
            <option value="accounts">Accounts & Fees</option>
            <option value="tech">IT Helpdesk</option>
          </select><br><br>

          <label for="message"><b>Message:</b></label><br>
          <textarea id="message" name="message" rows="4" style="width:100%; padding:8px; margin-top:5px;" required></textarea><br><br>

          <button type="submit" style="width:100%; padding:10px; background-color:#2E5A36; color:white; border:none; cursor:pointer;">Submit Ticket</button>
        </form>
      </td>
    </tr>
  </table>

</body>
</html>
